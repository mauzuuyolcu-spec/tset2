<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frekans — Anlık Sohbet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

    <!-- KATILIM EKRANI -->
    <div id="join-screen">
        <div class="tuner-card">
            <div class="tuner-eyebrow">SİNYAL ARANIYOR</div>
            <h1 class="tuner-title">FREKANS</h1>
            <p class="tuner-sub">Bir kanal adı seç, yayına gir.</p>
            <div class="waveform" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="dial-readout" aria-hidden="true">88.5&nbsp;MHz</div>
            <form id="join-form" autocomplete="off">
                <label for="username-input" class="visually-hidden">Kanal adın (kullanıcı adı)</label>
                <input id="username-input" type="text" maxlength="20" placeholder="Adını yaz..." required />
                <button type="submit" id="join-btn">KANALA BAĞLAN</button>
            </form>
            <p id="join-error" class="join-error hidden"></p>
        </div>
    </div>

    <!-- SOHBET EKRANI -->
    <div id="chat-screen" class="hidden">
        <header class="chat-header">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                <span class="brand-name">FREKANS</span>
            </div>
            <div class="status">
                <span class="status-dot" aria-hidden="true"></span>
                <span id="online-count" class="status-text">0 çevrimiçi</span>
            </div>
        </header>

        <main id="messages" class="messages"></main>

        <div id="typing-indicator" class="typing-indicator hidden">
            <span class="typing-dots"><span></span><span></span><span></span></span>
            <span id="typing-text"></span>
        </div>

        <footer class="composer">
            <!-- Resim butonu -->
            <button id="image-btn" type="button" aria-label="Resim ekle" title="Resim ekle (max 25MB)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="2" width="20" height="20" rx="2.18" />
                    <circle cx="8.5" cy="8.5" r="1.5" />
                    <path d="M22 15l-5-5-5 5-5-5-5 5" />
                </svg>
            </button>
            <input id="image-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp" style="display:none" />

            <!-- Video butonu -->
            <button id="video-btn" type="button" aria-label="Video ekle" title="Video ekle (max 20MB)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="4" width="20" height="16" rx="2" />
                    <polygon points="10,8 16,12 10,16" />
                </svg>
            </button>
            <input id="video-input" type="file" accept="video/mp4,video/webm,video/ogg" style="display:none" />

            <input id="message-input" type="text" maxlength="500" placeholder="Mesaj yaz veya dosya ekle..." autocomplete="off" />
            <button id="send-btn" type="button" aria-label="Gönder">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M3 11.5L21 3L13.5 21L11 13L3 11.5Z" stroke="currentColor" stroke-width="1.8" />
                </svg>
            </button>
        </footer>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
